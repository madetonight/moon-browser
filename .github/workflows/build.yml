name: Build Moon
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Core tests
        run: swift test -c release --disable-sandbox
      - name: Build release executable
        run: swift build -c release --disable-sandbox
