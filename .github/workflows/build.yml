name: Build Moon
on:
  push:
    paths: &app-paths
      - 'Sources/**'
      - 'Tests/**'
      - 'Support/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'build.sh'
      - 'test.sh'
      - '.github/workflows/build.yml'
  pull_request:
    paths: *app-paths
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Core tests
        run: swift test -c release --disable-sandbox
      - name: Check current release notes
        run: python3 Scripts/check-release-notes.py
      - name: Build release executable
        run: swift build -c release --disable-sandbox
